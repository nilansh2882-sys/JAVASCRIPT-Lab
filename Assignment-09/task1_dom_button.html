<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Change Heading</title></head>
<body>
  <h1 id="heading">Welcome</h1>
  <button id="changeButton">Change text</button>
  <script>
    document.getElementById("changeButton").addEventListener("click", () => {
      document.getElementById("heading").textContent = "Button clicked";
    });
  </script>
</body>
</html>
